{% load static %}
<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta name="description" content="Review live music!"/>
    <meta name="keywords" content="Live music, gigs, shows, reviews">

    <title>LMN</title>
    <link rel="shortcut icon" href="{% static 'favicon/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/base_style.css' %}" type="text/css">
  </head>

  <body>

    <h1>
        <a href="{% url 'homepage' %}">LMN</a>
    </h1>

    <div class="nav-bar">
    <div class="nav-left">
        <a href="{% url 'venue_list' %}">Venues</a>
        <a href="{% url 'artist_list' %}">Artists</a>
        <a href="{% url 'show_list' %}">Shows</a>
        <a href="{% url 'latest_notes' %}">Notes</a>
    </div>

    <div class="nav-right">
        {% if user.is_authenticated %}
            <span id="welcome-user-msg">
                You are logged in,
                <a href="{% url 'user_profile' user_pk=user.pk %}">{{ user.username }}</a>.
            </span>

            <form id="logout-form" action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button id="logout-button" type="submit">Logout</button>
            </form>
        {% else %}
            <span id="login-or-sign-up">
                <a href="{% url 'login' %}?next={{ request.path }}">Login or sign up</a>
            </span>
        {% endif %}
    </div>
    </div>

    <hr>

    {% block content %}
    {% endblock %}

    <script src="{% static 'js/confirm-logout.js'%}"></script>
    <script src="{% static 'js/star-ratings.js'%}"></script>

  </body>
</html>
